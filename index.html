<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmateurFriction</title>
    <link rel="stylesheet" href="Css/style.css">
<header>
    <div class="slogan">
    <h1>AmateurFriction</h1>
    <p>Turn your deadline into a realistic plan.</p>
    </div>
    <div class="information">
        <form id="AIform">
            <label for="date">When is the deadline of your desired task?</label>
            <br>
            <input type="date" id="date">
            <br>
            <label for="time">Select time:</label>
            <br>
            <input for="time" id="time" name="time">
            <br>
            <br>
        <textarea class="question" id="question" placeholder="What is the task?">
        </textarea> 
        <br>
            <textarea class="additional" id="additional" placeholder="Anything else you'd like to let us know about?">
            </textarea>
            <br>
            <button class="submit">Submit</button>
            </form>
    </div>
</body>
</html>
