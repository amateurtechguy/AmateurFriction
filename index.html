<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmateurFriction</title>
    <link rel="icon" type="img/png" href="images/favicon.png">
    <link rel="stylesheet" href="Css/style.css">
</head>
<body>
    <header>
        <div class="slogan">
        <h1>AmateurFriction</h1>
        <p>Turn your urgent deadline into an organized plan.</p>
        </div>
        <a href="help.html" class="helptext">
        <button class="help" type="help">?</button>
        </a>
    </header>
    <br>
        <div class="information">
            <div class="title">Information</div>
            <form action="">
                <div class="user-details">
                <div class="input-box">
                    <span class="Task">Task</span>
                    <input type="text" placeholder="Enter the desired task" required>
                </div>
                <div class="input-box">
                    <span class="Date">Date</span>
                    <input type="Date" placeholder="Date of the required task" required>
                </div>
                  <div class="input-box">
                    <span class="Time">Time</span>
                    <input type="time" placeholder="Time of the required task" required>
                </div>
                  <div class="input-box">
                    <span class="Extra">Extra information</span>
                    <textarea type="text" placeholder="Anything else you want to add?" required></textarea>
                </div>
            </div>
            <div class="submit">
                <input type="submit" value="Submit">
            </div>
        </form>
      </div>
    </div>
    </header>
</body>

 <script src="js/plan.js"></script>
</html>
